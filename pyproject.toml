[project]
name = "openrelik-worker-agti"
version = "0.1.0"
description = "Analysis with Agentic Google Threat Intelligence (AGTI)"
authors = [{name = "Wajih Yassine", email = "wajihyassine@gmail.com"}]
requires-python = ">=3.12,<4.0"
readme = "README.md"
dependencies = [
    "celery[redis]<6.0.0,>=5.4.0",
    "debugpy>=1.8.7,<2.0.0",
    "openrelik-common>=0.7.7,<1.0.0",
    "openrelik-worker-common>=0.17.3,<1.0.0",
    "requests>=2.31.0",
]

[dependency-groups]
test = [
    "pytest",
    "pytest-cov<6.0.0,>=5.0.0",
]

[tool.uv]
package = false
default-groups = []
